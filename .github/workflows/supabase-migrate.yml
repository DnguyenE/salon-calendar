name: Deploy Supabase migrations

# Runs only when commits land on `main` AND a migration file actually changed.
# This prevents accidental schema deploys from unrelated commits and keeps CI minutes low.
on:
  push:
    branches: [master]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-migrate.yml"
  workflow_dispatch: {}

# Never run two deploys against the same DB at the same time.
concurrency:
  group: supabase-migrate-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: supabase db push (prod)
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: piuwmiykfmpjkcqpffxq
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show pending migrations (dry-run summary)
        run: supabase migration list --linked

      - name: Push migrations to production
        run: supabase db push --linked
